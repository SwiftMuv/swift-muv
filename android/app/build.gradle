apply plugin: 'com.android.application'

android {
    namespace = "com.swiftmuv.app.v2"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.swiftmuv.app.v2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
        }
        // Prefer the machine-local key. A project-wide value can silently
        // override a valid Mac key and produce an authenticated map surface
        // whose tiles turn beige after the first frame.
        def envProps = new Properties()
        def envFile = rootProject.projectDir.parentFile ? new File(rootProject.projectDir.parentFile, '.env') : null
        if (envFile?.exists()) {
            envFile.eachLine { line ->
                def m = (line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*"?([^"#]*)"?\s*$/)
                if (m.matches()) { envProps.setProperty(m[0][1], m[0][2].trim()) }
            }
        }
        def mapsKey = localProps.getProperty('SWIFTMUV_GOOGLE_MAPS_ANDROID_KEY') ?:
            System.getenv('SWIFTMUV_GOOGLE_MAPS_ANDROID_KEY') ?:
            project.findProperty('SWIFTMUV_GOOGLE_MAPS_ANDROID_KEY') ?:
            envProps.getProperty('SWIFTMUV_GOOGLE_MAPS_ANDROID_KEY') ?:
            envProps.getProperty('VITE_GOOGLE_MAPS_BROWSER_KEY') ?: ''
        if (mapsKey.toString().trim().isEmpty()) {
            logger.warn('SWIFTMUV_GOOGLE_MAPS_ANDROID_KEY not set; building without a native Maps key. Add it to android/local.properties for full map access.')
        }
        manifestPlaceholders = [SWIFTMUV_GOOGLE_MAPS_ANDROID_KEY: mapsKey]
        versionCode 12
        versionName "1.0.11"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Android Studio used to package whichever WebView files happened to be left
// by the last manual `cap sync`. That made device builds stale while the Vite
// preview showed current styles. Rebuild and copy the web app for every native
// build so the APK/AAB always contains the current source tree.
// Best-effort only: Android Studio often launches without Node/npm on its PATH
// (nvm, Homebrew, Windows), which used to break every compile. If the automatic
// web build can't run, we fall back to whatever `npx cap sync android` already
// copied from the terminal.
tasks.register('prepareCapacitorWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    ignoreExitValue true
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (isWindows) {
        commandLine 'cmd', '/c', 'npm run build && npx cap sync android'
    } else {
        commandLine '/bin/bash', '-lc', 'export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"; [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"; npm run build && npx cap sync android'
    }
    doFirst { logger.lifecycle('Building web app and syncing Capacitor (best effort)...') }
}

tasks.register('verifyCapacitorWebAssets') {
    dependsOn prepareCapacitorWebAssets
    doLast {
        def indexHtml = file('src/main/assets/public/index.html')
        if (!indexHtml.exists()) {
            throw new GradleException('Web app files are missing. In Terminal run: npm install && npm run build && npx cap sync android, then build again.')
        }
    }
}

preBuild.dependsOn verifyCapacitorWebAssets

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
